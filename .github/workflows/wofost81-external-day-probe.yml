name: WOFOST81 real Python day boundary probe
on:
  pull_request:
    paths:
      - 'pcse/tests/test_wofost81_external_day_probe.py'
      - '.github/workflows/wofost81-external-day-probe.yml'
  workflow_dispatch:
jobs:
  actual-pcse-one-day:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python -m unittest -v pcse.tests.test_wofost81_external_day_probe
