name: WOFOST81 Scientific Qualification

on:
  push:
    branches:
      - audit/wofost81-scientific-qualification
  pull_request:
  workflow_dispatch:

jobs:
  scientific-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PCSE
        run: python -m pip install -e .
      - name: Run WOFOST81 scientific qualification tests
        run: python -m unittest -v pcse.tests.test_snomin_scientific pcse.tests.test_wofost81_reallocation_scientific pcse.tests.test_wofost81_snomin_e2e pcse.tests.test_wofost81_deep_logic pcse.tests.test_partitioning pcse.tests.test_respiration pcse.tests.test_wofost81_nstress_domain

      - name: Reproduce historical WOFOST72 PGASS YAML regression
        run: python -m unittest -v tests.test_assimilation_yaml_regression

      - name: Probe WOFOST81 crop-N zero reachability
        run: python -m unittest -v pcse.tests.test_wofost81_nzero_reachability

      - name: Run legacy WOFOST full-model regression envelope
        run: |
          python - <<'PY'
          import unittest
          from pcse.tests.test_wofost72 import suite
          result = unittest.TextTestRunner(verbosity=2).run(suite())
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY

      - name: Export provisional WOFOST81 wheat reference traces
        run: python -m pcse.tests.export_wofost81_reference --out wofo-reference

      - name: Preserve provisional Python reference artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wofost81-wheat-python-provisional
          path: wofo-reference/
          if-no-files-found: error

      - name: Reproduce WOFOST81 reference in two fresh Python environments
        shell: bash
        run: |
          set -euo pipefail
          for pass in a b; do
            python -m venv ".venv-ref-$pass"
            ".venv-ref-$pass/bin/python" -m pip install -e .
            ".venv-ref-$pass/bin/python" -m pcse.tests.export_wofost81_reference --out "reference-$pass"
          done
          python - <<'PY'
          import hashlib
          from pathlib import Path
          for name in ("wofost81_wheat_reference_provisional.json",
                       "wofost81_wheat_low_mineral_n_provisional.json",
                       "manifest.json"):
              first = Path("reference-a", name).read_bytes()
              second = Path("reference-b", name).read_bytes()
              assert first == second, f"Different reference bytes: {name}"
              print("REPRODUCIBLE", name, len(first), hashlib.sha256(first).hexdigest())
          PY
